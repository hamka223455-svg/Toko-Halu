<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toko</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
/* Dasar tampilan untuk Cuan dan Toko. Warna diatur lewat token di style.css masing-masing. */
:root {
  --bg: #f4f1ee; --card: #ffffff; --fg: #231a14; --mute: #7a6d64; --line: #e8e1db;
  --p1: #b84a00; --p2: #e8630a; --pfg: #ffffff; --accent: #f2b705; --good: #1b8a4b; --bad: #d23b2e; --soft: #fdeee0;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #17120f; --card: #221b17; --fg: #f3ece6; --mute: #a39588; --line: #362d27; --soft: #33251a; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body.noscroll { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.tab-num { font-variant-numeric: tabular-nums; }
.shell { max-width: 480px; margin: 0 auto; min-height: 100%; background: var(--bg); position: relative; padding-bottom: 72px; }
.strip { background: linear-gradient(90deg, var(--p1), var(--p2)); color: var(--pfg); font-size: 12px; padding: 7px 16px; text-align: center; }
.strip.demo { background: #333; }
main { padding: 0 0 8px; }
.pad { padding: 14px 16px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { display: flex; width: 100%; max-width: 480px; }
.tab { flex: 1; border: 0; background: none; padding: 8px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--mute); position: relative; }
.tab .ic { font-size: 20px; line-height: 1; filter: grayscale(1) opacity(.7); }
.tab.on { color: var(--p2); font-weight: 600; }
.tab.on .ic { filter: none; }
.badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--bad); color: #fff; font-size: 10px; display: grid; place-items: center; padding: 0 4px; }

.card { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 14px; }
.row { display: flex; gap: 10px; align-items: center; }
.row > * { min-width: 0; }
.between { justify-content: space-between; }
.grow { flex: 1; }
.mute { color: var(--mute); }
.sm { font-size: 12px; }
.good { color: var(--good); } .bad { color: var(--bad); }
.stack { display: flex; flex-direction: column; gap: 10px; }

.btn { border: 0; border-radius: 10px; background: linear-gradient(180deg, var(--p2), var(--p1)); color: var(--pfg); padding: 11px 16px; font-weight: 600; min-height: 42px; }
.btn.ghost { background: var(--card); color: var(--p1); border: 1px solid var(--p2); }
.btn.dark { background: #2b2b2b; }
.btn.bad { background: var(--bad); }
.btn.good { background: var(--good); color: #fff; }
.btn.sm { min-height: 34px; padding: 6px 12px; font-size: 13px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, .tab:focus-visible, .chip:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

label.f { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--mute); }
.in, select.in, textarea.in { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 12px; min-height: 42px; color: var(--fg); }
textarea.in { min-height: 84px; resize: vertical; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 11px; font-size: 12px; }
.chip.on { background: var(--soft); border-color: var(--p2); color: var(--p1); font-weight: 600; }
.scrollx { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.scrollx::-webkit-scrollbar { display: none; }
.scrollx > * { flex: none; }
.err { color: var(--bad); font-size: 12px; min-height: 16px; }

.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--card); width: 100%; max-width: 480px; border-radius: 16px 16px 0 0; max-height: 90%; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); animation: up .18s ease-out; }
.sheet.full { height: 90%; }
.sheet-h { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 8px; }
.sheet-b { padding: 4px 16px 16px; overflow-y: auto; }
.x { border: 0; background: var(--bg); width: 30px; height: 30px; border-radius: 50%; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }

.screen { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; padding-top: env(safe-area-inset-top, 0px); }
@media (min-width: 481px) { .screen { box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); } }
.screen-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: linear-gradient(90deg, var(--p1), var(--p2)); color: var(--pfg); }
.screen-h b { flex: 1; font-size: 16px; }
.screen-h .back { border: 0; background: rgba(255,255,255,.18); color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 22px; line-height: 1; }
.screen-r { font-size: 13px; font-variant-numeric: tabular-nums; }
.screen-b { flex: 1; overflow-y: auto; padding: 14px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }

.toast { position: fixed; left: 50%; bottom: 90px; transform: translate(-50%, 12px); background: #222; color: #fff; padding: 9px 16px; border-radius: 10px; z-index: 99; opacity: 0; pointer-events: none; transition: .2s; max-width: 86vw; font-size: 13px; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.auth { max-width: 420px; margin: 0 auto; padding: 0 0 30px; min-height: 100%; }
.auth-hero { background: linear-gradient(160deg, var(--p1), var(--p2)); color: var(--pfg); padding: 40px 24px 70px; }
.auth-hero h1 { font-size: 26px; }
.auth-hero p { margin: 6px 0 0; opacity: .9; }
.auth-card { margin: -44px 16px 0; padding: 18px; }
.seg { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; margin-bottom: 14px; }
.seg button { flex: 1; border: 0; background: none; padding: 8px; border-radius: 8px; color: var(--mute); }
.seg button.on { background: var(--card); color: var(--p1); font-weight: 600; box-shadow: var(--shadow); }
.list > * + * { border-top: 1px solid var(--line); }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 0; width: 100%; background: none; border: 0; text-align: left; }
.li .ico { width: 34px; height: 34px; border-radius: 10px; background: var(--soft); display: grid; place-items: center; font-size: 18px; flex: none; }
.li .t { flex: 1; min-width: 0; }
.li .t small { display: block; color: var(--mute); }
.li .chev { color: var(--mute); }
.empty { text-align: center; color: var(--mute); padding: 40px 16px; }
.foot { text-align: center; color: var(--mute); font-size: 11px; padding: 18px 16px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* chat */
.msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.bub { max-width: 80%; padding: 8px 12px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.35; }
.bub small { display: block; opacity: .7; font-size: 10px; margin-top: 2px; text-align: right; }
.bub.me { align-self: flex-end; background: linear-gradient(180deg, var(--p2), var(--p1)); color: var(--pfg); border-bottom-right-radius: 4px; }
.bub.them { align-self: flex-start; background: var(--card); box-shadow: var(--shadow); border-bottom-left-radius: 4px; }
.cbar { display: flex; gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--card); border-top: 1px solid var(--line); }
.cbar .in { flex: 1; }
.bg3 { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; padding: 0 5px; font-weight: 700; }
.li .ico.avt { border-radius: 50%; font-weight: 700; color: var(--p1); }
.vg { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--card); }
.vo { display: flex; gap: 6px; align-items: flex-end; }
.vo > * { min-width: 0; }

/* peringkat */
.rkme { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; background: var(--soft); }
.li .ico.rk { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.li .ico.rk.top { background: transparent; font-size: 24px; }
.li.meli { background: var(--soft); margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
.tab { min-width: 0; font-size: 10.5px; }
.badge[hidden] { display: none; }
.card:has(.meli) { overflow: hidden; }

/* bank */
.bhero { background: linear-gradient(160deg, var(--p1), var(--p2)); color: var(--pfg); border-radius: 14px; padding: 18px 16px; margin-bottom: 10px; box-shadow: var(--shadow); }
.bamt { display: block; font-size: 30px; margin: 2px 0 4px; overflow-wrap: anywhere; }
.bgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.bgrid b { font-size: 17px; overflow-wrap: anywhere; }
.bloan { margin-bottom: 10px; border: 1px solid var(--p2); }
.bacts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.bact { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 600; box-shadow: var(--shadow); }
.bact span { font-size: 24px; }
.bact:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.opt.on { border-color: var(--p2); background: var(--soft); }
.opt small { display: block; color: var(--mute); }
.opt input { margin-top: 3px; }
.bhero.own { background: linear-gradient(160deg, #1f6f5a, #2fa37f); }
.ubadge { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--soft); color: var(--p1); margin-left: 4px; vertical-align: 1px; }
.ubadge.red { background: #fde4e1; color: #b3261e; }
.ubadge.blue { background: #e3edfb; color: #1c4f9c; }
.usec { font-weight: 700; margin: 4px 0 2px; }

/* Toko: oranye-cokelat hangat, struktur mengikuti video referensi */
:root { --p1: #a84300; --p2: #e8630a; --pfg: #fff; --soft: #fdeee0; --bg: #f4f0ec; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #17120f; --card: #221b17; --soft: #33251a; --line: #362d27; --fg: #f3ece6; --mute: #a39588; } }

.hd { display: flex; align-items: center; gap: 6px; padding: 10px 12px; background: linear-gradient(180deg, var(--p1), var(--p2)); position: sticky; top: 0; z-index: 10; color: #fff; }
.hd.solo { justify-content: center; font-size: 16px; padding: 14px; }
.search { flex: 1; display: flex; align-items: center; gap: 8px; background: #fff; color: #333; border-radius: 6px; padding: 0 10px; height: 38px; }
.search input { border: 0; outline: 0; flex: 1; min-width: 0; background: none; color: #333; font-size: 14px; }
.hb { border: 0; background: none; color: #fff; font-size: 22px; padding: 4px 6px; position: relative; }
.bg2 { position: absolute; top: -2px; right: -4px; background: #fff; color: var(--p1); border: 1px solid var(--p2); font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; display: grid; place-items: center; padding: 0 3px; }

.banners { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 0; background: linear-gradient(180deg, var(--p2), #c34f06 60%, var(--bg)); padding: 10px 0 14px; }
.banners::-webkit-scrollbar { display: none; }
.bn { flex: 0 0 calc(100% - 24px); margin: 0 12px; scroll-snap-align: center; border-radius: 14px; padding: 18px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #fff; min-height: 150px; }
.bn:first-child { margin-left: 12px; }
.b1 { background: radial-gradient(circle at 85% 20%, #ff9a3c55, transparent 50%), linear-gradient(135deg, #c1500a, #7e2e00); }
.b2 { background: radial-gradient(circle at 85% 20%, #ffd16655, transparent 50%), linear-gradient(135deg, #8a3a00, #4d2100); }
.b3 { background: radial-gradient(circle at 85% 20%, #ffb26655, transparent 50%), linear-gradient(135deg, #b8470a, #6c2a00); }
.bn b { font-size: 19px; font-style: italic; }
.bn p { margin: 4px 0 12px; font-size: 12px; opacity: .9; max-width: 170px; }
.bi { font-size: 76px; line-height: 1; filter: drop-shadow(0 6px 10px rgba(0,0,0,.3)); }
.pill { border: 0; background: #fff; color: var(--p1); font-weight: 700; font-size: 12px; padding: 6px 14px; border-radius: 999px; }
.dots { display: flex; justify-content: center; gap: 5px; margin: -12px 0 6px; position: relative; }
.dots i { width: 5px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.55); transition: width .2s; }
.dots i.on { width: 14px; background: #fff; }

.catg { display: grid; grid-auto-flow: column; grid-template-rows: repeat(2, auto); grid-auto-columns: 20%; overflow-x: auto; background: var(--card); padding: 12px 4px; scrollbar-width: none; gap: 10px 0; }
.catg::-webkit-scrollbar { display: none; }
.cat { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 2px; }
.ci { width: 40px; height: 40px; border-radius: 12px; background: var(--soft); display: grid; place-items: center; font-size: 22px; }
.cat small { font-size: 10px; text-align: center; line-height: 1.2; color: var(--mute); }

.sec { background: var(--card); margin-top: 8px; padding: 10px 12px; }
.fs { color: var(--p1); font-style: italic; }
.cd i { background: #222; color: #fff; font-style: normal; padding: 1px 4px; border-radius: 3px; font-size: 12px; font-variant-numeric: tabular-nums; }
.cd { display: inline-flex; gap: 2px; align-items: center; margin-left: -40px; }
.lnk { border: 0; background: none; color: var(--mute); font-size: 12px; }
.fsrow { margin-top: 8px; }
.fsi { border: 0; background: none; width: 104px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.fsi b { color: var(--p1); font-size: 13px; }
.fsi small s { color: var(--mute); font-size: 11px; }
.bar { position: relative; height: 14px; background: #f3d9c3; border-radius: 7px; overflow: hidden; }
.bar span { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #f08a1d, #e8630a); }
.bar em { position: absolute; inset: 0; font-size: 9px; font-style: normal; color: #fff; text-align: center; line-height: 14px; }
.rek { text-align: center; color: var(--p1); font-weight: 600; padding: 12px; background: var(--card); margin-top: 8px; border-bottom: 2px solid var(--p2); }

.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; }
.pc { border: 0; background: var(--card); text-align: left; padding: 0 0 8px; border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; gap: 3px; }
.pimg { position: relative; aspect-ratio: 1; background: #eee; }
.pimg.sm { width: 104px; height: 104px; aspect-ratio: auto; border-radius: 4px; overflow: hidden; }
.pimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dbadge { position: absolute; top: 0; right: 0; background: #ffe14d; color: #c0390b; font-size: 11px; font-weight: 700; padding: 1px 5px; }
.dbadge.s { position: static; margin-left: 6px; }
.sold-out { position: absolute; inset: 0; background: rgba(0,0,0,.45); color: #fff; display: grid; place-items: center; font-weight: 700; }
.pn { font-size: 12px; padding: 4px 8px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; height: 2.9em; }
.pp { color: var(--p1); font-weight: 700; padding: 0 8px; }
.po { color: var(--mute); font-size: 11px; padding: 0 8px; }
.pm, .pl { color: var(--mute); font-size: 10px; padding: 0 8px; }

.mhero { background: linear-gradient(180deg, var(--p1), var(--p2)); color: #fff; padding: 14px 16px 12px; }
.mhero .avatar { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.25); display: grid; place-items: center; font-weight: 700; font-size: 20px; }
.avatar.sm { width: 40px; height: 40px; border-radius: 50%; background: var(--soft); color: var(--p1); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.cp { border: 1px solid rgba(255,255,255,.7); background: none; color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 8px; margin-left: 4px; }
.hemat { background: var(--card); color: var(--fg); border-radius: 12px; padding: 12px 14px; margin-top: 12px; }
.ost { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; }
.ost button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.oi { position: relative; font-size: 24px; }
.ost small { font-size: 11px; color: var(--mute); }

.pdp .screen-h { background: transparent; position: absolute; left: 0; right: 0; top: env(safe-area-inset-top, 0px); z-index: 3; }
.pdp .screen-h .back, .pdp .screen-h .hb { background: rgba(0,0,0,.45); border-radius: 50%; width: 34px; height: 34px; padding: 0; font-size: 17px; }
.pdp .screen-b { padding-top: 0 !important; }
.gal { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; background: #eee; scrollbar-width: none; }
.gal img { flex: 0 0 100%; aspect-ratio: 1; object-fit: cover; scroll-snap-align: center; max-width: none; }
.card0 { background: var(--card); }
.price b { font-size: 22px; color: var(--p1); }
.price s { color: var(--mute); margin-left: 8px; font-size: 13px; }
.ptitle { font-size: 15px; font-weight: 500; margin: 6px 0; }
.info { background: var(--card); margin-top: 8px; padding: 12px 16px; }
.irow { display: flex; gap: 14px; padding: 7px 0; font-size: 13px; }
.irow > :first-child { width: 78px; flex: none; }
.vc { font-style: normal; font-size: 11px; color: var(--p1); border: 1px solid var(--p2); padding: 1px 5px; background: var(--soft); margin-right: 4px; }
.buybar { position: fixed; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto; display: flex; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5; align-items: stretch; }
.screen .buybar { position: absolute; }
.bb { flex: 0 0 22%; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 18px; padding: 6px 2px; color: var(--p1); border-right: 1px solid var(--line); }
.bb small { font-size: 9px; text-align: center; line-height: 1.1; }
.bbuy { flex: 1; border: 0; background: var(--p1); color: #fff; font-weight: 700; min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.bbuy small { font-weight: 400; font-size: 11px; }
.bbuy:disabled { opacity: .5; }
.pill2 { display: inline-block; margin-top: 6px; border: 1px solid var(--p2); color: var(--p1); background: var(--soft); border-radius: 999px; padding: 2px 12px; font-size: 12px; font-variant-numeric: tabular-nums; }
.warn { background: #fff1e6; color: #a84300; border-radius: 6px; padding: 10px 12px; margin: 0 8px; font-size: 12px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .warn { background: #3a2415; color: #ffb27a; } }

.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.th { width: 76px; height: 76px; border-radius: 10px; overflow: hidden; position: relative; background: var(--soft); display: grid; place-items: center; font-size: 28px; color: var(--p1); border: 1px dashed var(--p2); cursor: pointer; }
.th img { width: 100%; height: 100%; object-fit: cover; }
.th button { position: absolute; top: 2px; right: 2px; border: 0; background: rgba(0,0,0,.6); color: #fff; width: 22px; height: 22px; border-radius: 50%; font-size: 11px; }

/* pembayaran berhasil */
.succ .screen-b { background: var(--bg); }
.shero { background: linear-gradient(180deg, var(--p1), var(--p2)); color: #fff; text-align: center; padding: 34px 16px 70px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.shero b { font-size: 18px; margin-top: 8px; }
.scheck { width: 54px; height: 54px; border-radius: 50%; border: 3px solid #fff; display: grid; place-items: center; font-size: 28px; animation: pop .5s cubic-bezier(.2,1.4,.4,1); }
.samt { font-size: 30px; font-weight: 800; margin: 2px 0; overflow-wrap: anywhere; }
